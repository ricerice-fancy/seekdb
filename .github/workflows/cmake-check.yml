name: CMake Compile Check (official build.sh path)

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git wget rpm rpm2cpio cpio make build-essential \
            binutils m4 libtool-bin libssl-dev zlib1g-dev libbz2-dev libreadline-dev \
            libsqlite3-dev curl bison flex cmake ninja-build clang lld python3
      - name: Build via official build.sh (same as grading platform)
        run: |
          set -o pipefail
          ./build.sh release --init 2>&1 | tee /tmp/init.log
          INIT_RC=${PIPESTATUS[0]}
          echo "INIT exit code: $INIT_RC"
          if [ "$INIT_RC" -ne 0 ]; then echo "INIT FAILED (rc=$INIT_RC)"; tail -40 /tmp/init.log; exit 1; fi
          cd build_release && make -j4 2>&1 | tee /tmp/make.log
          MAKE_RC=${PIPESTATUS[0]}
          echo "MAKE exit code: $MAKE_RC"
          if [ "$MAKE_RC" -ne 0 ]; then echo "MAKE FAILED (rc=$MAKE_RC)"; tail -60 /tmp/make.log; exit 1; fi
          test -x src/observer/seekdb && echo "CMAKE BUILD OK"
